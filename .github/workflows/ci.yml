name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest (Node ${{ matrix.node }}, Bun 1.4.5)
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: npm ci --prefix tests/fixtures/nest-app
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest tests -q
